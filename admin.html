<!DOCTYPE html>
<html lang="si" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#061626">
    <title>StepLK Admin - Review & Audit Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { dark: '#061626', card: '#0B1E36', emerald: '#10B981', emeraldDark: '#059669', yellow: '#F59E0B', charcoal: '#0F172A', border: '#1E293B' } } } }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-brand-dark text-slate-100 font-sans antialiased min-h-screen">

    <!-- LOGIN MODAL -->
    <div id="login-modal" class="fixed inset-0 z-[100] bg-brand-dark flex items-center justify-center p-4">
        <div class="bg-brand-card border border-brand-border rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center">
            <h2 class="text-xl font-bold text-white mb-4">StepLK Admin Login</h2>
            <form id="login-form" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Email</label>
                    <input type="email" id="login-email" required class="w-full bg-brand-dark border border-slate-700 rounded-xl p-2.5 text-white outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full bg-brand-dark border border-slate-700 rounded-xl p-2.5 text-white outline-none">
                </div>
                <div id="login-error" class="hidden text-xs text-red-400 text-center font-semibold"></div>
                <button type="submit" class="w-full bg-brand-emerald text-brand-dark font-black py-2.5 rounded-xl">LOGIN</button>
            </form>
        </div>
    </div>

    <!-- MAIN ADMIN DASHBOARD -->
    <div id="admin-app" class="hidden pb-20">
        <header class="bg-brand-charcoal border-b border-brand-border px-4 py-3 flex justify-between items-center">
            <span class="text-xl font-black text-white">StepLK Admin</span>
            <button id="btn-logout" class="text-xs text-red-400 bg-red-500/10 px-3 py-1.5 rounded-xl border border-red-500/30">Logout</button>
        </header>

        <main class="max-w-3xl mx-auto px-4 py-4">
            <div class="flex border-b border-slate-800 mb-4 gap-3 text-xs font-bold overflow-x-auto">
                <button onclick="switchTab('PENDING')" class="pb-2 text-emerald-400 border-b-2 border-emerald-400">Pending</button>
                <button onclick="switchTab('PUBLISHED')" class="pb-2 text-slate-400">Published</button>
            </div>

            <!-- PENDING SECTION -->
            <div id="pending-posts-section" class="bg-brand-card p-4 rounded-xl border border-brand-border">
                <form id="review-form" class="space-y-3 text-xs">
                    <input type="hidden" id="current-post-id">
                    <input type="text" id="field-title" class="w-full bg-brand-dark border border-slate-700 p-2.5 text-white" placeholder="Title">
                    <input type="text" id="field-org" class="w-full bg-brand-dark border border-slate-700 p-2.5 text-white" placeholder="Organization">
                    <select id="field-category" class="w-full bg-brand-dark border border-slate-700 p-2.5 text-white">
                        <option value="Government Job">Government Job</option>
                        <option value="Private Job">Private Job</option>
                    </select>
                    <textarea id="field-description" class="w-full bg-brand-dark border border-slate-700 p-2.5 text-white h-24" placeholder="Description"></textarea>
                    
                    <div class="flex gap-2 pt-2">
                        <button type="button" id="btn-publish" class="flex-1 bg-brand-emerald text-brand-dark py-2.5 rounded-xl font-bold">Publish</button>
                    </div>
                </form>
            </div>
            
            <div id="published-posts-section" class="hidden text-xs text-slate-300">
                 <!-- Published list renders here -->
                 <div id="published-posts-list" class="space-y-2"></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        const SUPABASE_URL = 'https://wlgnfprghzczwjjpoqym.supabase.co';
        // 🔴 මෙතනට අනිවාර්යයෙන්ම ANON_KEY එක (Public Key එක) දාන්න. Service Role Key එක දාන්න එපා! 🔴
        const SUPABASE_ANON_KEY = 'sb_publishable_j4dFy0AhNEmQOIEUpsS7mg_83NOxeFj'; 
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, match => {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return map[match];
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('admin-app').classList.remove('hidden');
                loadPendingPosts();
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('login-error').innerText = '❌ වැරදියි!';
                document.getElementById('login-error').classList.remove('hidden');
            } else {
                window.location.reload();
            }
        });

        document.getElementById('btn-logout').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.reload();
        });

        async function loadPendingPosts() {
            const { data } = await supabase.from('posts').select('*').eq('status', 'PENDING').order('created_at', { ascending: true }).limit(1);
            if (data && data.length > 0) {
                const item = data[0];
                document.getElementById('current-post-id').value = item.id;
                document.getElementById('field-title').value = item.title;
                document.getElementById('field-org').value = item.organization;
                document.getElementById('field-category').value = item.category;
                document.getElementById('field-description').value = item.description;
            }
        }

        document.getElementById('btn-publish').addEventListener('click', async () => {
            const id = document.getElementById('current-post-id').value;
            if(!id) return;
            await supabase.from('posts').update({ 
                title: escapeHtml(document.getElementById('field-title').value),
                status: 'PUBLISHED' 
            }).eq('id', id);
            loadPendingPosts();
        });

        window.switchTab = function(tab) {
            if(tab === 'PENDING') {
                document.getElementById('pending-posts-section').classList.remove('hidden');
                document.getElementById('published-posts-section').classList.add('hidden');
            } else {
                document.getElementById('pending-posts-section').classList.add('hidden');
                document.getElementById('published-posts-section').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
