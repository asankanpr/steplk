<!DOCTYPE html>
<html lang="si" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#061626">
    
    <title>StepLK Admin - Review Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#061626',
                            card: '#0B1E36',
                            emerald: '#10B981',
                            emeraldDark: '#059669',
                            yellow: '#F59E0B',
                            charcoal: '#0F172A',
                            border: '#1E293B',
                            red: '#EF4444'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-brand-dark text-slate-100 font-sans antialiased min-h-screen">

    <!-- LOGIN MODAL -->
    <div id="login-modal" class="fixed inset-0 z-[100] bg-brand-dark flex items-center justify-center p-4">
        <div class="bg-brand-card border border-brand-border rounded-2xl p-6 w-full max-w-sm shadow-2xl space-y-4 text-center">
            <div class="inline-flex bg-gradient-to-r from-brand-emerald to-brand-yellow px-3 py-1.5 rounded-xl text-brand-dark font-black text-xl mb-1">
                StepLK<span class="text-white">🚀</span>
            </div>
            <h2 class="text-base font-bold text-white">Admin Login</h2>

            <form id="login-form" class="space-y-3 text-left">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-300 mb-1">Email Address</label>
                    <input type="email" id="login-email" required placeholder="admin@steplk.com" class="w-full bg-brand-dark border border-slate-700 focus:border-brand-emerald rounded-xl p-2.5 text-xs text-white outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-300 mb-1">Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-brand-dark border border-slate-700 focus:border-brand-emerald rounded-xl p-2.5 text-xs text-white outline-none">
                </div>
                
                <div id="login-error" class="hidden text-xs text-red-400 bg-red-500/10 p-2 rounded-lg border border-red-500/20 text-center font-semibold"></div>

                <button type="submit" id="btn-login" class="w-full bg-brand-emerald hover:bg-brand-emeraldDark text-brand-dark font-black py-2.5 rounded-xl transition text-xs flex items-center justify-center gap-2 shadow-lg shadow-brand-emerald/20">
                    <i class="fa-solid fa-lock"></i> LOGIN TO DASHBOARD
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN ADMIN DASHBOARD -->
    <div id="admin-app" class="hidden pb-20">
        
        <header class="bg-brand-charcoal border-b border-brand-border sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="bg-gradient-to-r from-brand-emerald to-brand-yellow px-2.5 py-1 rounded-lg text-brand-dark font-black text-sm">
                    StepLK 🚀
                </span>
                <span class="text-xs bg-amber-500/10 text-brand-yellow border border-amber-500/30 px-2 py-0.5 rounded-full font-bold">Admin Panel</span>
            </div>

            <div class="flex items-center gap-2">
                <span id="pending-count" class="bg-brand-emerald/20 text-brand-emerald border border-brand-emerald/40 text-xs font-bold px-2.5 py-1 rounded-full flex items-center gap-1">
                    <i class="fa-solid fa-clock"></i> Pending: <span id="count-val">0</span>
                </span>
                <button id="btn-logout" class="text-xs bg-red-500/10 text-red-400 hover:bg-red-500/20 px-3 py-1.5 rounded-lg border border-red-500/30 font-semibold transition flex items-center gap-1">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </header>

        <main class="max-w-2xl mx-auto px-4 py-4 space-y-4">

            <div id="toast" class="hidden bg-emerald-500/20 border border-emerald-500/50 text-emerald-300 p-3 rounded-xl text-xs font-semibold flex items-center gap-2">
                <i class="fa-solid fa-circle-check text-base"></i>
                <span id="toast-msg">Action successful!</span>
            </div>

            <div class="flex border-b border-slate-800 mb-4 gap-6">
                <button id="tab-pending" onclick="switchTab('PENDING')" class="pb-3 text-sm font-bold text-emerald-400 border-b-2 border-emerald-400 transition-all flex items-center gap-2">
                    Pending Verification
                    <span id="pending-badge" class="bg-amber-500/20 text-amber-400 text-xs px-2 py-0.5 rounded-full font-mono">0</span>
                </button>
                <button id="tab-published" onclick="switchTab('PUBLISHED')" class="pb-3 text-sm font-bold text-slate-400 hover:text-white transition-all">
                    Published Posts
                </button>
            </div>
            
            <!-- Pending Verification Section -->
            <div id="pending-posts-section">
                <div id="review-card" class="bg-brand-card border border-brand-border rounded-2xl p-4 shadow-xl space-y-4">
                    
                    <div class="flex items-center justify-between border-b border-brand-border pb-3">
                        <div>
                            <span class="text-[10px] text-slate-400 block uppercase tracking-wider">Source: Drive Document</span>
                            <span class="text-xs text-brand-yellow font-bold"><i class="fa-solid fa-robot"></i> AI Auto-Extracted</span>
                        </div>
                        <span id="item-id-display" class="bg-slate-800 text-slate-300 text-[11px] px-2.5 py-1 rounded-md border border-slate-700 font-mono">No Items</span>
                    </div>

                    <form id="review-form" class="space-y-3 text-xs">
                        <input type="hidden" id="current-post-id">

                        <div>
                            <label class="block font-semibold text-slate-300 mb-1">තැන්න / පාඨමාලාවේ නම (Title):</label>
                            <input type="text" id="field-title" class="w-full bg-brand-dark border border-slate-700 focus:border-brand-emerald rounded-xl p-2.5 text-white outline-none">
                        </div>

                        <div>
                            <label class="block font-semibold text-slate-300 mb-1">ආයතනය (Organization):</label>
                            <input type="text" id="field-org" class="w-full bg-brand-dark border border-slate-700 focus:border-brand-emerald rounded-xl p-2.5 text-white outline-none">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-semibold text-slate-300 mb-1">වර්ගය (Category):</label>
                                <select id="field-category" class="w-full bg-brand-dark border border-slate-700 focus:border-brand-emerald rounded-xl p-2.5 text-white outline-none">
                                    <option value="Government Job">Government Job</option>
                                    <option value="කඩඉම් විභාග">කඩඉම් විභාග (EB Exam)</option>
                                    <option value="Course">Course</option>
                                    <option value="Semi-Govt Job">Semi-Govt Job</option>
                                </select>
                            </div>
                            <div>
                                <label class="block font-semibold text-slate-300 mb-1">MEQ Filter Tag:</label>
                                <select id="field-meq" class="w-full bg-brand-dark border border-slate-700 focus:border-brand-emerald rounded-xl p-2.5 text-white outline-none">
                                    <option value="NONE">වැදගත් නොවේ</option>
                                    <option value="OL">O/L</option>
                                    <option value="AL">A/L</option>
                                    <option value="NVQ">NVQ / Diploma</option>
                                    <option value="DEGREE">Degree</option>
                                    <option value="POST_GRAD">Post Graduate</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-semibold text-slate-300 mb-1">වැටුප් කේතය (Salary Code):</label>
                                <input type="text" id="field-salary-code" placeholder="e.g. MN-1" class="w-full bg-brand-dark border border-slate-700 focus:border-brand-emerald rounded-xl p-2.5 text-white outline-none">
                            </div>
                            <div>
                                <label class="block font-semibold text-slate-300 mb-1">වැටුප / ගාස්තුව (Salary):</label>
                                <input type="text" id="field-salary-amount" placeholder="e.g. LKR 38,500" class="w-full bg-brand-dark border border-slate-700 focus:border-brand-emerald rounded-xl p-2.5 text-white outline-none">
                            </div>
                        </div>

                        <div>
                            <label class="block font-semibold text-brand-emerald mb-1"><i class="fa-solid fa-graduation-cap"></i> සුදුසුකම් (Qualifications):</label>
                            <textarea id="field-qualifications" rows="3" class="w-full bg-brand-dark border border-slate-700 focus:border-brand-emerald rounded-xl p-2.5 text-white outline-none leading-relaxed"></textarea>
                        </div>

                        <div>
                            <label class="block font-semibold text-brand-yellow mb-1"><i class="fa-solid fa-align-left"></i> විස්තරය (Description):</label>
                            <textarea id="field-description" rows="3" class="w-full bg-brand-dark border border-slate-700 focus:border-brand-emerald rounded-xl p-2.5 text-white outline-none leading-relaxed"></textarea>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-semibold text-slate-300 mb-1">අවසන් දිනය (Closing):</label>
                                <input type="date" id="field-date" class="w-full bg-brand-dark border border-slate-700 focus:border-brand-emerald rounded-xl p-2.5 text-white outline-none">
                            </div>
                            <div>
                                <label class="block font-semibold text-slate-300 mb-1">මුලාශ්‍රය (Source):</label>
                                <input type="text" id="field-source" class="w-full bg-brand-dark border border-slate-700 focus:border-brand-emerald rounded-xl p-2.5 text-white outline-none" readonly>
                            </div>
                        </div>
                    </form>

                    <div class="pt-2 grid grid-cols-2 gap-3 border-t border-slate-800">
                        <button type="button" id="btn-reject" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 py-3 rounded-xl font-bold transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-trash-can"></i> Reject Post
                        </button>
                        <button type="button" id="btn-publish" class="bg-brand-emerald hover:bg-brand-emeraldDark text-brand-dark py-3 rounded-xl font-black transition flex items-center justify-center gap-2 shadow-lg shadow-brand-emerald/20">
                            <i class="fa-solid fa-paper-plane"></i> PUBLISH NOW
                        </button>
                    </div>

                </div>
            </div>

            <!-- Published Posts Section -->
            <div id="published-posts-section" class="hidden">
                <div id="published-posts-list" class="grid gap-3"></div>
            </div>

        </main>
    </div>

    <!-- SUPABASE SCRIPT -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        const SUPABASE_URL = 'https://wlgnfprghzczwjjpoqym.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_j4dFy0AhNEmQOIEUpsS7mg_83NOxeFj';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginModal = document.getElementById('login-modal');
        const adminApp = document.getElementById('admin-app');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                showDashboard();
                loadPendingPosts();
            } else {
                showLoginModal();
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                loginError.innerText = '❌ Email හෝ Password වැරදියි!';
                loginError.classList.remove('hidden');
            } else {
                showDashboard();
                loadPendingPosts();
            }
        });

        document.getElementById('btn-logout').addEventListener('click', async () => {
            await supabase.auth.signOut();
            showLoginModal();
        });

        window.switchTab = function(tabName) {
            const pubSec = document.getElementById('published-posts-section');
            const pendSec = document.getElementById('pending-posts-section');
            const tabPub = document.getElementById('tab-published');
            const tabPend = document.getElementById('tab-pending');

            if (tabName === 'PUBLISHED') {
                pubSec.classList.remove('hidden');
                pendSec.classList.add('hidden');
                tabPub.className = "pb-3 text-sm font-bold text-emerald-400 border-b-2 border-emerald-400 transition-all";
                tabPend.className = "pb-3 text-sm font-bold text-slate-400 hover:text-white transition-all flex items-center gap-2";
                loadPublishedPosts();
            } else {
                pubSec.classList.add('hidden');
                pendSec.classList.remove('hidden');
                tabPend.className = "pb-3 text-sm font-bold text-emerald-400 border-b-2 border-emerald-400 transition-all flex items-center gap-2";
                tabPub.className = "pb-3 text-sm font-bold text-slate-400 hover:text-white transition-all";
                loadPendingPosts();
            }
        };

        async function loadPendingPosts() {
            const { data, error } = await supabase
                .from('posts')
                .select('*')
                .eq('status', 'PENDING')
                .order('created_at', { ascending: true });

            if (data && data.length > 0) {
                document.getElementById('count-val').innerText = data.length;
                document.getElementById('pending-badge').innerText = data.length;
                populateForm(data[0]);
            } else {
                document.getElementById('count-val').innerText = '0';
                document.getElementById('pending-badge').innerText = '0';
                clearForm();
            }
        }

        async function loadPublishedPosts() {
            const listContainer = document.getElementById('published-posts-list');
            listContainer.innerHTML = '<div class="text-xs text-slate-400 py-4 text-center"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>';

            const { data, error } = await supabase
                .from('posts')
                .select('*')
                .eq('status', 'PUBLISHED')
                .order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                listContainer.innerHTML = '<div class="text-xs text-slate-400 bg-brand-card p-4 rounded-xl border border-brand-border text-center">ප්‍රකාශිත පෝස්ට් නොමැත.</div>';
                return;
            }

            listContainer.innerHTML = data.map(post => `
                <div class="bg-brand-card border border-brand-border p-4 rounded-xl flex items-center justify-between gap-3">
                    <div>
                        <h4 class="font-bold text-sm text-white">${post.title || 'No Title'}</h4>
                        <p class="text-xs text-slate-400">${post.organization || ''} • <span class="text-brand-emerald font-semibold">${post.category || 'Job'}</span></p>
                    </div>
                    <span class="bg-emerald-500/10 text-emerald-400 text-xs font-bold px-2.5 py-1 rounded-full border border-emerald-500/20">LIVE</span>
                </div>
            `).join('');
        }

        function populateForm(item) {
            document.getElementById('current-post-id').value = item.id;
            document.getElementById('item-id-display').innerText = `ID: #${item.id.substring(0, 8)}`;
            document.getElementById('field-title').value = item.title || '';
            document.getElementById('field-org').value = item.organization || '';
            document.getElementById('field-category').value = item.category || 'Government Job';
            document.getElementById('field-meq').value = item.meq_level || 'NONE';
            document.getElementById('field-salary-code').value = item.salary_code || '';
            document.getElementById('field-salary-amount').value = item.salary_amount || item.salary_or_fee || '';
            document.getElementById('field-qualifications').value = item.qualifications || item.educational_qualifications || '';
            document.getElementById('field-description').value = item.description || item.experience_qualifications || '';
            document.getElementById('field-date').value = item.closing_date || '';
            document.getElementById('field-source').value = item.source || 'GDRIVE_AUTOMATION';
        }

        function clearForm() {
            document.getElementById('current-post-id').value = '';
            document.getElementById('item-id-display').innerText = 'No Items Left';
            document.getElementById('field-title').value = '';
            document.getElementById('field-org').value = '';
            document.getElementById('field-salary-code').value = '';
            document.getElementById('field-salary-amount').value = '';
            document.getElementById('field-qualifications').value = '';
            document.getElementById('field-description').value = '';
            document.getElementById('field-date').value = '';
        }

        document.getElementById('btn-publish').addEventListener('click', async () => {
            const postId = document.getElementById('current-post-id').value;
            if (!postId) return;

            const updatedData = {
                title: document.getElementById('field-title').value,
                organization: document.getElementById('field-org').value,
                category: document.getElementById('field-category').value,
                meq_level: document.getElementById('field-meq').value,
                salary_code: document.getElementById('field-salary-code').value,
                salary_amount: document.getElementById('field-salary-amount').value,
                qualifications: document.getElementById('field-qualifications').value,
                description: document.getElementById('field-description').value,
                closing_date: document.getElementById('field-date').value || null,
                status: 'PUBLISHED'
            };

            const { error } = await supabase.from('posts').update(updatedData).eq('id', postId);

            if (!error) {
                showToast("✅ පෝස්ටුව සාර්ථකව Live Publish කරන ලදී!");
                loadPendingPosts();
            } else {
                showToast("❌ Error: " + error.message);
            }
        });

        document.getElementById('btn-reject').addEventListener('click', async () => {
            const postId = document.getElementById('current-post-id').value;
            if (!postId) return;

            if (confirm("මෙම පෝස්ටුව ප්‍රතික්ෂේප කිරීමට අවශ්‍යද?")) {
                const { error } = await supabase.from('posts').update({ status: 'REJECTED' }).eq('id', postId);
                if (!error) {
                    showToast("❌ පෝස්ටුව ප්‍රතික්ෂේප කරන ලදී.");
                    loadPendingPosts();
                }
            }
        });

        function showDashboard() {
            loginModal.classList.add('hidden');
            adminApp.classList.remove('hidden');
        }

        function showLoginModal() {
            loginModal.classList.remove('hidden');
            adminApp.classList.add('hidden');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }
    </script>
</body>
</html>
