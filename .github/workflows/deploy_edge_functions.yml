name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main # ඔයාගේ ප්‍රධාන branch එක
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          
      - name: Deploy upload-image function
        # මෙතන --project-ref එකත් එක්කම Service Role Key එක පාවිච්චි කරලා ලොග් වෙනවා
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} 
        run: supabase functions deploy upload-image --project-ref wlgnfprghzczwjjpoqym
