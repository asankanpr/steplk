name: University Handbook Auto Processor

on:
  schedule:
    # SLT: 08:30 AM & 02:30 PM (UTC: 03:00 AM & 09:00 AM)
    - cron: '0 3,9 * * *'
  workflow_dispatch:

jobs:
  process-handbook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase google-genai PyMuPDF google-api-python-client google-auth

      - name: Run Handbook Processing Script
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GEMINI_HANDBOOK_KEY: ${{ secrets.GEMINI_HANDBOOK_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_HANDBOOK_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python process_university_handbook.py
