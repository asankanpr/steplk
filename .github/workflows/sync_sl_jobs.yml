name: Sync SL Job Scraper

on:
  schedule:
    # SLT: 07:30 AM & 01:30 PM (UTC: 02:00 AM & 08:00 AM)
    - cron: '0 2,8 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase google-genai beautifulsoup4 PyMuPDF

      - name: Run Job Sync Script
        env:
          SRC_SUPABASE_URL: ${{ secrets.SRC_SUPABASE_URL }}
          SRC_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SRC_SUPABASE_SERVICE_ROLE_KEY }}
          DEST_SUPABASE_URL: ${{ secrets.DEST_SUPABASE_URL }}
          DEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEST_SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_JOB_SCRAPER_KEY: ${{ secrets.GEMINI_JOB_SCRAPER_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_JOB_SCRAPER_KEY }}
        run: python sync_sl_job_scraper.py
