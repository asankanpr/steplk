name: Sync SL Job Scraper

on:
  schedule:
    # ශ්‍රී ලංකාවේ වේලාවෙන් (UTC+5:30):
    # 01:30 UTC -> පෙ.ව. 07:00 SLT
    # 05:30 UTC -> පෙ.ව. 11:00 SLT
    # 09:30 UTC -> ප.ව. 03:00 SLT
    - cron: '30 1,5,9 * * *'
  workflow_dispatch:       # GitHub UI එකෙන් පහසුවෙන් Manual Run කර ගැනීමට[cite: 3]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests supabase google-genai

      - name: Run Job Sync Script
        env:
          # Single Project පාවිච්චි කරන්නේ නම්[cite: 3]
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Projects දෙකක් පාවිච්චි කරන්නේ නම් (නැතහොත් උඩ ඒවා ස්වයංක්‍රීයව Fallback වේ)
          SRC_SUPABASE_URL: ${{ secrets.SRC_SUPABASE_URL }}
          SRC_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SRC_SUPABASE_SERVICE_ROLE_KEY }}
          DEST_SUPABASE_URL: ${{ secrets.DEST_SUPABASE_URL }}
          DEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEST_SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python sync_sl_job_scraper.py
