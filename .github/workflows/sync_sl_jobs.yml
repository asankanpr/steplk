name: Sync SL Job Scraper

on:
  schedule:
    - cron: '30 1,5,9 * * *'  # පෙ.ව. 07:00, පෙ.ව. 11:00 සහ ප.ව. 03:00 (SLT)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests supabase google-genai

      - name: Run Job Sync Script
        env:
          SRC_SUPABASE_URL: ${{ secrets.SRC_SUPABASE_URL }}
          SRC_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SRC_SUPABASE_SERVICE_ROLE_KEY }}
          DEST_SUPABASE_URL: ${{ secrets.DEST_SUPABASE_URL }}
          DEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEST_SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python sync_sl_job_scraper.py
