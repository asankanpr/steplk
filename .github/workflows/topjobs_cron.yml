name: Topjobs Auto Scraper Cron

on:
  schedule:
    - cron: '0 5 * * *'   # හරියටම උදෑසන 10:30 (Sri Lanka Time)
  workflow_dispatch:      # Manual එකේ Run කරන්න බොත්තමක් දෙනවා

jobs:
  scrape-topjobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests supabase beautifulsoup4

      - name: Run Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python topjobs_scraper.py
