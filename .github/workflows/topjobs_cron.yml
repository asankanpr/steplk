name: Topjobs Auto Scraper Cron

on:
  schedule:
    #- cron: '0 5 * * *'   # හරියටම උදෑසන 10:30 (Sri Lanka Time)
    #- cron: '0 10 * * *'   # 03:30 PM (පස්වරු 03:30)
    #- cron: '0 13 * * *'   # 06:30 PM (සවස 06:30)
    #- cron: '30 0 * * *'   # 06:00 AM (උදෑසන 06:00)  
  workflow_dispatch:      # Manual එකේ Run කරන්න බොත්තමක් දෙනවා

jobs:
  scrape-topjobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # 🔴 Updated for better security and stability

      - name: Install Dependencies
        run: |
          pip install requests supabase beautifulsoup4 Pillow

      - name: Run Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python topjobs_scraper.py
