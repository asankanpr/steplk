name: Google Drive Document Extractor

on:
  schedule:
    # SLT: 10:00 AM & 04:00 PM (UTC: 04:30 AM & 10:30 AM)
    - cron: '30 4,10 * * *'
  workflow_dispatch:

jobs:
  process-drive-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Drive Extractor Script
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GEMINI_DOC_EXTRACTOR_KEY: ${{ secrets.GEMINI_DOC_EXTRACTOR_KEY }}
          GEMINI_DRIVE_API_KEY: ${{ secrets.GEMINI_DOC_EXTRACTOR_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_DOC_EXTRACTOR_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-2.0-flash' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python process_drive_docs.py
